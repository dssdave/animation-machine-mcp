<!doctype html>
<!-- A typical animation an AI writes for Animation Machine.
     Pass it as the "html" argument of the render tool, e.g.
     render({ html: <this file>, aspects: ["16:9", "9:16"], music_url: <from search_music> })
     A GSAP timeline lets the renderer detect the exact length automatically. -->
<html>
<head>
<meta charset="utf-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b14; overflow: hidden; }
  body { display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; color: #fff; }
  .beat { position: absolute; font-size: min(12vw, 14vh); font-weight: 800; letter-spacing: -0.04em; opacity: 0; }
  .accent { color: #7c5cff; }
</style>
</head>
<body>
  <div class="beat" id="b1">Faster.</div>
  <div class="beat" id="b2">Simpler.</div>
  <div class="beat" id="b3">Acme Notes <span class="accent">2.0</span></div>
  <script>
    const tl = gsap.timeline();
    for (const id of ['#b1', '#b2']) {
      tl.fromTo(id, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' })
        .to(id, { opacity: 0, y: -40, duration: 0.4, ease: 'power2.in' }, '+=0.7');
    }
    tl.fromTo('#b3', { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.7, ease: 'back.out(1.6)' })
      .to({}, { duration: 1.5 });
  </script>
</body>
</html>
